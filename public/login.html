<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Man Bozo — Sign In</title>
<meta name="description" content="Bozo of the Week. Members only.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤡</text></svg>">
<script>
  try { var t = localStorage.getItem('bmb_theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="theme-toggle login-theme" role="group" aria-label="Appearance">
  <button class="theme-btn" data-theme="light" title="Light" aria-label="Light">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button class="theme-btn" data-theme="auto" title="Match system" aria-label="Match system">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
  </button>
  <button class="theme-btn" data-theme="dark" title="Dark" aria-label="Dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</div>

<div class="login-wrap">
  <div class="login-card">
    <div class="logo">
      <div class="mark">🤡</div>
      <h1>Blue Man Bozo</h1>
      <p>Bozo of the Week · members only</p>
    </div>

    <div id="error" class="login-error" hidden></div>

    <form id="form" autocomplete="on">
      <label class="field">
        <span>Username</span>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="submit" class="btn primary block" type="submit">Let me in</button>
    </form>

    <p class="tiny muted center" style="margin:18px 0 0">
      Lost your password? Yell at the commissioner.
    </p>
  </div>
</div>

<script>
(function () {
  function apply(mode) {
    var root = document.documentElement;
    if (mode === 'light' || mode === 'dark') root.dataset.theme = mode; else delete root.dataset.theme;
    document.querySelectorAll('.theme-btn').forEach(function (b) { var on = b.dataset.theme === (mode || 'auto'); b.classList.toggle('active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    try { if (mode === 'light' || mode === 'dark') localStorage.setItem('bmb_theme', mode); else localStorage.removeItem('bmb_theme'); } catch (e) {}
  }
  var saved = null; try { saved = localStorage.getItem('bmb_theme'); } catch (e) {}
  apply(saved);
  document.querySelectorAll('.theme-btn').forEach(function (b) {
    b.addEventListener('click', function () { apply(b.dataset.theme === 'auto' ? null : b.dataset.theme); });
  });
})();

const form = document.getElementById('form');
const errorBox = document.getElementById('error');
const submit = document.getElementById('submit');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  submit.disabled = true;
  submit.textContent = 'Checking…';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Login failed.');
    window.location.href = '/';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.hidden = false;
    submit.disabled = false;
    submit.textContent = 'Let me in';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
});
</script>
</body>
</html>
