<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Man Bozo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤡</text></svg>">
<script>
  // Apply a saved theme before first paint so there is no flash.
  try { var t = localStorage.getItem('bmb_theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#week">
      <div class="brand-mark">🤡</div>
      <div class="brand-text">
        <b>Blue Man Bozo</b>
        <span id="groupName">Bozo of the Week</span>
      </div>
    </a>
    <div class="theme-toggle" role="group" aria-label="Appearance">
      <button class="theme-btn" data-theme="light" title="Light" aria-label="Light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="theme-btn" data-theme="auto" title="Match system" aria-label="Match system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <button class="theme-btn" data-theme="dark" title="Dark" aria-label="Dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <div class="userchip-group" id="userChip" hidden>
      <button type="button" class="userchip" id="profileBtn" aria-label="Your profile and settings">
        <span class="av" id="userAvatar" aria-hidden="true">🤡</span>
        <span id="userName" class="chip-name">…</span>
      </button>
      <button type="button" class="btn sm ghost chip-out" id="logoutBtn">Sign out</button>
    </div>
  </div>
  <div class="topbar-inner" style="padding-top:0">
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="view">
  <div class="card"><div class="spinner"></div></div>
</main>

<div class="toast-wrap" id="toasts"></div>
<div id="modalRoot"></div>

<script src="/app.js"></script>
</body>
</html>
