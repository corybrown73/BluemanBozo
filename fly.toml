# Deploy config for Fly.io. Create the volume first:
#   fly volumes create bozo_data --size 1 --region <your-region>
app = "bluemanbozo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "3000"
  SITE_URL = "https://www.bluemanbozo.com"

[[mounts]]
  source = "bozo_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
