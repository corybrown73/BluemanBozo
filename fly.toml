# Deploy config for Fly.io.
#
# Port 8080 is Fly's convention. internal_port and PORT must agree, or
# fly-proxy waits on a port nothing is listening on and every health check
# times out ("not listening on the expected address").
#
# Before the first deploy, set the secrets — the app needs them to run:
#   fly secrets set SESSION_SECRET=$(openssl rand -hex 32) \
#     ODDS_API_KEY=your_key ADMIN_USERNAME=cory ADMIN_PASSWORD=something-long
app = "bluemanbozo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "8080"
  SITE_URL = "https://www.bluemanbozo.com"

[[mounts]]
  source = "bozo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
