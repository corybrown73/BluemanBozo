# fly.toml app configuration file generated for bluemanbozo on 2026-09-07T00:10:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bluemanbozo'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '3000'
  SITE_URL = 'https://www.bluemanbozo.com'

[[mounts]]
  source = 'bozo_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
